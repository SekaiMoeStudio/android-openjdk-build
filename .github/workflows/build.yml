name: Build OpenJDK for Android

on:
  workflow_dispatch:
  push:
jobs:
  build_android:
    name: "Build for Android aarch64"
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@main
    - name: set up JDK 17
      uses: actions/setup-java@main
      with:
        java-version: 17
        distribution: zulu
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt -y install systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ matrix.os }}
        create-symlink: true
        max-size: 1024MB
        verbose: 2
    - name: Build with CI build script
      run: bash -x "ci_build_arch_aarch64.sh"
    - name: Upload JDK build output
      uses: actions/upload-artifact@main
      with:
        name: "jdk17-aarch64"
        path: jdk17*.tar.xz
    - name: Upload JRE build output
      uses: actions/upload-artifact@main
      with:
        name: 'jre17-aarch64'
        path: jre17*.tar.xz
    - name: Upload JRE debuginfo build output
      uses: actions/upload-artifact@main
      with:
        name: "jre17-debuginfo-${{matrix.arch}}"
        path: dizout
